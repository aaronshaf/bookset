name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ['1.25.x', '1.26.x']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go mod verify
      - run: go mod tidy -diff
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./cmd/bookset

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.26.x'
          cache: true
      - uses: typst-community/setup-typst@63ac138db421d586de61f7f5ac3bcef6a2e6c78c # v5.1.0
        with:
          typst-version: '0.15.1'
      - name: Install PDF inspection tools
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils default-jre-headless unzip
      - name: Verify pinned toolchain
        run: |
          typst --version | grep -F 'typst 0.15.1'
          test -f toolchain.toml
      - name: Run publishing integration gate
        run: go test ./internal/integration -run TestSemanticChapterPublishesToBothFormats -count=1 -v
      - name: Build machine-readable publishing reports
        run: |
          mkdir -p out
          go run ./cmd/bookset build --config bookset.book.example.toml --format epub --output out/book.epub
          go run ./cmd/bookset build --config bookset.book.example.toml --format pdf --output out/book.pdf
          go run ./cmd/bookset inspect --config bookset.book.example.toml --artifact out/book.epub --json > out/epub-inspection.json
          go run ./cmd/bookset inspect --config bookset.book.example.toml --artifact out/book.pdf --json > out/pdf-inspection.json
          jq -e '(.schema == "bookset.artifact-inspection.v1") and (.status == "ok") and ((.issues | length) == 0)' out/epub-inspection.json
          jq -e '(.schema == "bookset.artifact-inspection.v1") and (.status == "ok") and ((.issues | length) == 0)' out/pdf-inspection.json
      - name: Validate EPUB package with EPUBCheck
        run: make epubcheck EPUB=out/book.epub
      - name: Upload inspection reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bookset-inspection-reports
          path: out/*-inspection.json
